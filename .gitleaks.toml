[extend]
useDefault = true

[[allowlists]]
description = "Local secrets and generated dependency/test output are outside the source scan"
paths = [
  '''(^|/)\.git/''',
  '''(^|/)\.env$''',
  '''(^|/)node_modules/''',
  '''(^|/)playwright-report/''',
  '''(^|/)test-results/''',
  '''(^|/)coverage/''',
  '''(^|/)uploads/'''
]
