name: governed-workflow-ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: governed-legalforms-${{ github.ref }}
  cancel-in-progress: true

jobs:
  governed-document-workflow:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: legalforms_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d legalforms_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      NODE_ENV: test
      DB_SSL_MODE: disable
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/legalforms_test
      PUPPETEER_SKIP_DOWNLOAD: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            governed-runtime/package-lock.json
      - name: Install test dependencies
        run: npm ci --ignore-scripts
      - name: Apply migrations twice
        run: |
          npm run migrate
          npm run migrate
      - name: Governed integration and API tests
        run: npm run test:governed
      - name: Syntax and template build
        run: npm run build
      - name: Audit minimal production dependencies
        run: |
          npm ci --omit=dev --ignore-scripts --prefix governed-runtime
          npm audit --omit=dev --audit-level=low --prefix governed-runtime
      - name: Build governed production image
        run: docker build --tag legalforms-governed:${{ github.sha }} .
      - name: Scan repository for secrets
        run: >-
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1
          dir /repo --config /repo/.gitleaks.toml --redact --no-banner
